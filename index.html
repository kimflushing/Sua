<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HALPHAS — iPhone</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #f2f2f7;
  --blue: #007aff;
  --text: #19191d;
  --muted: #8e8e93;
}

body {
  margin: 0;
  padding: 25px 12px;
  background: #e8e8ed;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.page {
  max-width: 900px;
  margin: auto;
}

.intro {
  text-align: center;
  margin-bottom: 24px;
}

.intro h1 {
  font-size: 25px;
  letter-spacing: -1px;
}

.intro p {
  font-size: 12px;
  line-height: 1.8;
  color: #666;
}

.phone {
  width: 100%;
  max-width: 340px;
  margin: auto;
  padding: 9px;
  background: #202024;
  border: 2px solid #555;
  border-radius: 45px;
  box-shadow: 0 20px 55px #0002;
}

.screen {
  height: 680px;
  position: relative;
  overflow: hidden;
  border-radius: 35px;
  background: var(--bg);
}

.status {
  height: 32px;
  padding: 9px 22px 0;
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  font-weight: bold;
  position: relative;
  z-index: 5;
}

.island {
  position: absolute;
  top: 7px;
  left: 50%;
  transform: translateX(-50%);
  width: 90px;
  height: 24px;
  background: #000;
  border-radius: 20px;
  z-index: 6;
}

.view {
  position: absolute;
  inset: 32px 0 0;
  overflow-y: auto;
}

.hidden {
  display: none !important;
}

/* LOCK SCREEN */

.lock {
  min-height: 100%;
  padding: 35px 20px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  color: white;
  background: linear-gradient(
    155deg,
    #9eafc1,
    #d8d9e0 48%,
    #a8b2c0
  );
}

.lock-date {
  margin-top: 25px;
  font-size: 15px;
}

.lock-time {
  margin-top: 4px;
  font-size: 76px;
  font-weight: 250;
  letter-spacing: -4px;
}

.notification {
  width: 100%;
  margin-top: 25px;
  padding: 14px;
  border-radius: 17px;
  text-align: left;
  color: #25252a;
  background: #ffffffc9;
  font-size: 12px;
  line-height: 1.6;
}

.notification strong {
  display: block;
  margin-bottom: 4px;
}

.lock-space {
  flex: 1;
  min-height: 70px;
}

.unlock {
  border: 0;
  border-radius: 22px;
  padding: 12px 22px;
  background: #ffffffdd;
  color: #222;
  font-weight: bold;
  cursor: pointer;
}

/* HOME */

.home {
  min-height: 100%;
  padding: 20px 15px;
  background: linear-gradient(150deg, #e4e5ed, #f7f7fa, #d9dce5);
}

.widget {
  padding: 16px;
  margin-bottom: 22px;
  border-radius: 22px;
  background: #ffffffb8;
}

.widget-label {
  font-size: 11px;
  color: #666;
}

.widget-time {
  margin: 5px 0;
  font-size: 34px;
  font-weight: 600;
}

.widget-sub {
  font-size: 11px;
  color: #777;
}

.app-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 23px 5px;
}

.app {
  min-width: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  border: 0;
  background: transparent;
  color: #222;
  font-size: 10px;
  cursor: pointer;
}

.icon {
  width: 49px;
  height: 49px;
  display: grid;
  place-items: center;
  border-radius: 13px;
  background: white;
  box-shadow: 0 2px 5px #0001;
  font-size: 25px;
}

.app-label {
  white-space: nowrap;
}

.dock {
  margin-top: 30px;
  padding: 12px 5px;
  display: flex;
  justify-content: space-around;
  border-radius: 24px;
  background: #ffffffa8;
}

.dock .icon {
  width: 46px;
  height: 46px;
}

/* APP SCREENS */

.app-screen {
  min-height: 100%;
  padding-bottom: 30px;
  background: var(--bg);
}

.nav {
  height: 48px;
  padding: 0 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav button {
  border: 0;
  background: transparent;
  color: var(--blue);
  font-size: 27px;
  cursor: pointer;
}

.nav-title {
  font-size: 12px;
  color: #666;
}

.app-heading {
  padding: 10px 17px 18px;
}

.app-heading h2 {
  margin: 0 0 4px;
  font-size: 30px;
  letter-spacing: -1px;
}

.app-heading p {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
}

.content {
  padding: 0 14px;
}

.card {
  margin-bottom: 10px;
  padding: 14px;
  border-radius: 15px;
  background: white;
  font-size: 13px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.small {
  margin-top: 3px;
  color: var(--muted);
  font-size: 11px;
}

.person {
  display: flex;
  align-items: center;
  gap: 10px;
}

.avatar {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  border-radius: 50%;
  background: #eeeef3;
  font-size: 20px;
}

.bubble {
  max-width: 85%;
  margin: 9px 0;
  padding: 10px 12px;
  border-radius: 16px;
  background: white;
  font-size: 13px;
  line-height: 1.5;
}

.bubble.out {
  margin-left: auto;
  background: #a1dc86;
}

.action {
  margin-top: 10px;
  padding: 10px 13px;
  border: 0;
  border-radius: 12px;
  color: white;
  background: var(--blue);
  cursor: pointer;
}

.photo-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
}

.photo {
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  border-radius: 7px;
  background: linear-gradient(135deg, #c9d0dc, #eee5e8);
  font-size: 32px;
}

.note {
  margin-bottom: 10px;
  padding: 14px;
  border-radius: 12px;
  background: #fff4c4;
  font-size: 13px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.note strong {
  display: block;
  margin-bottom: 6px;
}

.field {
  width: 100%;
  margin: 5px 0;
  padding: 11px;
  border: 1px solid #ddd;
  border-radius: 10px;
  background: white;
  font: inherit;
  font-size: 13px;
}

.home-indicator {
  position: absolute;
  z-index: 10;
  bottom: 7px;
  left: 50%;
  width: 100px;
  height: 4px;
  transform: translateX(-50%);
  border-radius: 10px;
  background: #222;
}

@media (max-width: 400px) {
  body {
    padding: 12px 8px;
  }

  .screen {
    height: 650px;
  }
}
</style>
</head>

function openApp(key) {
  const app = apps[key];

  if (!app) return;

  lockView.classList.add("hidden");
  homeView.classList.add("hidden");
  appView.classList.remove("hidden");

  $("navTitle").textContent = app.title;
  $("appTitle").textContent = app.title;
  $("appSubtitle").textContent = app.subtitle;
  appContent.innerHTML = app.html;

  appView.scrollTop = 0;
}

document.querySelectorAll("[data-app]").forEach(button => {
  button.addEventListener("click", () => {
    openApp(button.dataset.app);
  });
});

function addNote() {
  const titleInput = $("noteTitle");
  const bodyInput = $("noteBody");
  const list = $("notesList");

  if (!titleInput || !bodyInput || !list) return;

  const title = titleInput.value.trim() || "제목 없음";
  const body = bodyInput.value.trim();

  if (!body && !titleInput.value.trim()) return;

  const note = document.createElement("div");
  note.className = "note";

  const heading = document.createElement("strong");
  heading.textContent = title;

  const content = document.createElement("div");
  content.textContent = body;

  note.appendChild(heading);
  note.appendChild(content);
  list.prepend(note);

  titleInput.value = "";
  bodyInput.value = "";
}

function unlockSecret() {
  const input = $("secretPassword");
  const content = $("secretContent");

  if (!input || !content) return;

  if (input.value === "1225") {
    content.classList.remove("hidden");
  } else {
    input.value = "";
    input.placeholder = "암호가 올바르지 않습니다";
  }
}

function showUnknownChat() {
  appContent.innerHTML = `
    <div class="card">
      <b>알 수 없는 번호</b>
      <div class="small">오늘</div>
      <div class="bubble">전화 좀 받아. 급한 일이야.</div>
      <div class="bubble out">누구지.</div>
      <div class="bubble">연구실에서 있었던 일, 얘기해야겠어.</div>
      <div class="bubble out">용건만 말해.</div>

      <input class="field" id="replyInput" placeholder="메시지 입력">
      <button class="action" onclick="sendReply()">보내기 ↑</button>
    </div>
  `;
}

function sendReply() {
  const input = $("replyInput");

  if (!input || !input.value.trim()) return;

  const bubble = document.createElement("div");
  bubble.className = "bubble out";
  bubble.textContent = input.value.trim();

  input.parentElement.insertBefore(bubble, input);
  input.value = "";
}

function updateClock() {
  const now = new Date();
  const time = now.toLocaleTimeString("ko-KR", {
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  });

  $("lockTime").textContent = time;
  $("homeTime").textContent = time;
}

updateClock();
setInterval(updateClock, 30000);
</script>
